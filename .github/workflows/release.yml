name: Release

# A version tag (v1.0.0, …) builds the signed-ad-hoc .dmg on Apple Silicon and
# attaches it to a draft GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    name: macOS .dmg (arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Build
        # the backend sidecar, the Tauri bundle and the .dmg (see scripts/build_dmg.sh)
        run: scripts/build_dmg.sh
      - name: Checksum
        run: cd dist && shasum -a 256 *.dmg > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: dist/*
      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/SHA256SUMS.txt --draft --title "JARVIS $GITHUB_REF_NAME" --generate-notes
