name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: System libraries
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libportaudio2 libgl1
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # the CPU build of PyTorch: CI has no GPU, and the default wheel is several GB larger
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check jarvis tests ../scripts
      - name: Mypy
        run: mypy
      - name: Cache face models
        uses: actions/cache@v4
        with:
          path: models
          key: models-face-${{ hashFiles('scripts/download_models.py') }}
      - name: Download the face models (the model tests skip if this fails)
        continue-on-error: true
        working-directory: .
        run: python -c "import sys; sys.path.insert(0, 'scripts'); import download_models as d; d.face(); d.liveness()"
      - name: Tests
        # Mac-only tests skip themselves; Ollama isn't available on CI
        run: python -m pytest -m "not ollama" -q

  ui:
    name: UI (lint, types, tests, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  shell:
    name: Desktop shell (rustfmt, clippy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: System libraries (Tauri on Linux)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build the UI (the shell embeds it)
        working-directory: app
        run: npm ci && npm run build
      - name: rustfmt
        working-directory: app/src-tauri
        run: cargo fmt --check
      - name: clippy
        working-directory: app/src-tauri
        run: cargo clippy --all-targets -- -D warnings
