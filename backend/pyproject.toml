[project]
name = "jarvis-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "cryptography>=43",
  "keyring>=25",
  "numpy>=1.26",
  "opencv-python>=4.10",
  "onnxruntime>=1.19",
  "insightface>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
