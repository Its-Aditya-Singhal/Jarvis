[project]
name = "jarvis-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "cryptography>=43",
  "keyring>=25",
  "numpy>=1.26",
  "opencv-python>=4.10",
  "onnxruntime>=1.19",
  "insightface>=2.0",
  "torch>=2.4",
  "speechbrain>=1.0",
  "silero-vad>=5.1",
  "sounddevice>=0.5",
  "faster-whisper>=1.1",
  "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",  # Whisper on the Apple GPU
  "kokoro-onnx>=0.4",
  "rapidfuzz>=3.9",
  "indic-transliteration>=2.3",
  "httpx>=0.27",
  "psutil>=5.9",
  "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",  # quitting apps politely (no extra permission)
  "pyobjc-framework-AVFoundation>=10; sys_platform == 'darwin'",  # reading the microphone permission
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "scipy>=1.11", "ruff>=0.6", "mypy>=1.11"]
train = ["scikit-learn>=1.4"]  # only for comparing models in scripts/train_fusion.py

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
markers = [
  "mac: needs macOS or Mac hardware (camera, microphone, `say`, AppleScript, Apple GPU); skipped elsewhere",
  "models: needs the downloaded models in models/ (scripts/download_models.py); skipped when missing",
  "ollama: needs a local Ollama with the configured model; skipped when not running",
]

[tool.ruff]
line-length = 130
target-version = "py311"
extend-include = ["../scripts/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "PLE", "RUF100"]
ignore = [
  "E501",  # long lines are fine where they read better
  "E701", "E702", "E731",  # compact one-liners in tests and small lambdas
  "B008",  # FastAPI's Depends() in argument defaults
  "B905",  # zip() over sequences of equal length by construction
]

[tool.ruff.lint.isort]
known-first-party = ["jarvis"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
files = ["jarvis"]
