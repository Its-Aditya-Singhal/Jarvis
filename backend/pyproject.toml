[project]
name = "jarvis-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "cryptography>=43",
  "keyring>=25",
  "numpy>=1.26",
  "opencv-python>=4.10",
  "onnxruntime>=1.19",
  "insightface>=2.0",
  "torch>=2.4",
  "speechbrain>=1.0",
  "silero-vad>=5.1",
  "sounddevice>=0.5",
  "faster-whisper>=1.1",
  "kokoro-onnx>=0.4",
  "rapidfuzz>=3.9",
  "indic-transliteration>=2.3",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "scipy>=1.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
